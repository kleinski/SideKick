<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="50%" stop-color="#111C30"/>
      <stop offset="100%" stop-color="#091522"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="50%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#00C896" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#00A8E8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00C896" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0088FF"/>
      <stop offset="38%" stop-color="#00D4A1"/>
      <stop offset="68%" stop-color="#0FA982"/>
      <stop offset="100%" stop-color="#00E5A8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132238"/>
      <stop offset="100%" stop-color="#0A1322"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="24" fill="url(#glowCenter)"/>

  <!-- Top Badges -->
  <g transform="translate(600, 74)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif">
    <text y="0" fill="#FFFFFF" font-size="36" font-weight="700" letter-spacing="-0.5">SideKick</text>
    <text y="28" fill="#94A3B8" font-size="16" font-weight="500">One Android Tablet · Seamless Multi-Mac Second Display</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(275, 128)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="198" height="32" rx="16" fill="#0FA982" fill-opacity="0.18" stroke="#00C896" stroke-opacity="0.5"/>
    <text x="99" y="21" text-anchor="middle" fill="#6EE7B7">⌘⇧T  Instant Takeover</text>

    <rect x="216" y="0" width="176" height="32" rx="16" fill="#0FA982" fill-opacity="0.18" stroke="#00C896" stroke-opacity="0.5"/>
    <text x="304" y="21" text-anchor="middle" fill="#6EE7B7">🔒  AES-256-GCM</text>

    <rect x="410" y="0" width="240" height="32" rx="16" fill="#0FA982" fill-opacity="0.18" stroke="#00C896" stroke-opacity="0.5"/>
    <text x="530" y="21" text-anchor="middle" fill="#6EE7B7">⚡  H.265 · HiDPI · 120 Hz</text>
  </g>

  <!-- Left MacBook (MacBook Pro #1) -->
  <g transform="translate(86, 225)" filter="url(#shadow)">
    <rect x="18" y="0" width="290" height="192" rx="12" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="28" y="10" width="270" height="172" rx="6" fill="url(#screenGrad)"/>
    <!-- macOS Menu bar -->
    <rect x="28" y="10" width="270" height="16" rx="3" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="40" cy="18" r="2.5" fill="#FF5F56"/>
    <circle cx="49" cy="18" r="2.5" fill="#FFBD2E"/>
    <circle cx="58" cy="18" r="2.5" fill="#27C93F"/>
    <!-- Base -->
    <path d="M0,194 L326,194 L314,208 L12,208 Z" fill="url(#metal)"/>
    <rect x="132" y="194" width="62" height="4" rx="2" fill="#64748B"/>
    <text x="163" y="238" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Work MacBook Pro</text>
    <text x="163" y="257" text-anchor="middle" fill="#00C896" font-family="-apple-system, sans-serif" font-size="12">● Active Host</text>
  </g>

  <!-- Right MacBook (MacBook Air #2) -->
  <g transform="translate(788, 225)" filter="url(#shadow)">
    <rect x="18" y="0" width="290" height="192" rx="12" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <rect x="28" y="10" width="270" height="172" rx="6" fill="url(#screenGrad)"/>
    <rect x="28" y="10" width="270" height="16" rx="3" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="40" cy="18" r="2.5" fill="#FF5F56"/>
    <circle cx="49" cy="18" r="2.5" fill="#FFBD2E"/>
    <circle cx="58" cy="18" r="2.5" fill="#27C93F"/>
    <path d="M0,194 L326,194 L314,208 L12,208 Z" fill="url(#metal)"/>
    <rect x="132" y="194" width="62" height="4" rx="2" fill="#64748B"/>
    <text x="163" y="238" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Personal MacBook</text>
    <text x="163" y="257" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">⌘⇧T Ready for Takeover</text>
  </g>

  <!-- Glowing SideKick Wave Connecting Both MacBooks Through Center Tablet -->
  <g filter="url(#glow)">
    <path d="M126,332 C220,255 310,395 430,335 C520,290 680,290 770,335 C890,395 980,255 1074,332"
          fill="none" stroke="url(#waveMain)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M126,348 C230,275 320,408 430,350 C520,305 680,305 770,350 C880,408 970,275 1074,348"
          fill="none" stroke="#00E5A8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.55"/>
  </g>

  <!-- Center Android Tablet -->
  <g transform="translate(454, 245)" filter="url(#shadow)">
    <rect x="0" y="0" width="292" height="196" rx="18" fill="#0B1324" stroke="#00C896" stroke-opacity="0.65" stroke-width="2.5"/>
    <rect x="12" y="12" width="268" height="172" rx="10" fill="url(#screenGrad)"/>
    <!-- Wave clipped softly inside tablet -->
    <path d="M14,104 C86,52 198,150 278,94" fill="none" stroke="url(#waveMain)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Mini-Status-Pill preview inside tablet -->
    <rect x="44" y="20" width="204" height="22" rx="11" fill="#0F172A" fill-opacity="0.88" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="56" cy="31" r="3" fill="#00C896"/>
    <text x="65" y="34.5" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">MacBook Pro · 60 FPS · 🔒</text>
    <rect x="182" y="24" width="24" height="14" rx="7" fill="#0FA982"/>
    <text x="194" y="34" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700">Mac</text>
    <text x="216" y="34" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="9">⌘</text>
    <text x="233" y="34" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="8">⋯</text>
    <!-- Floating Trigger preview -->
    <circle cx="262" cy="164" r="11" fill="#0F172A" stroke="#00C896" stroke-width="1.5"/>
    <path d="M256,164 Q262,158 268,164" fill="none" stroke="#00E5A8" stroke-width="2" stroke-linecap="round"/>

    <text x="146" y="226" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Android Tablet</text>
    <text x="146" y="245" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12">USB-C or Wi-Fi · Touch · Keyboard · Zoom</text>
  </g>
</svg>
